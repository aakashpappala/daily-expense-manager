# Production Configuration Profile
server.port=${PORT:8082}
server.error.include-message=always

# Production MySQL Database Connection via Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expensetrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Aakash@535}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Production Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Security Configuration
app.jwt.secret=${JWT_SECRET:9a2f8c4e7b1d3a5f6e8d0c2b4a6f8e1d3c5b7a9f0e2d4c6b8a1f3e5d7c9b0a2f}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
